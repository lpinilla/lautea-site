{{ define "main" }}
  <main class="content page-template 404" role="main">
    <article class="post page">
      <header class="post-header">
        <a id="blog-logo" href="{{ "" | relLangURL }}">
          {{ .Site.Title }}
        </a>
      </header>
      <h1 class="post-title">{{ i18n "notFoundTitle" | default "404" }}</h1>
      <section class="post-content">
        {{ i18n "notFoundText" | default "Esa página no existe." }}
        <a href="{{ "" | relLangURL }}">{{ i18n "notFoundLink" | default "Volver al inicio" }}</a>.
      </section>
    </article>
  </main>
{{ end }}
