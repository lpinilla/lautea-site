baseURL = "https://lautea.com.ar/"

# El sitio es una home "one page" más las páginas de artículo sueltas, así que
# no generamos listados de sección, taxonomías ni RSS. `robotsTXT` queda fuera
# de disableKinds a propósito: así Hugo no genera el suyo y manda el
# static/robots.txt que escribimos a mano.
disableKinds = ["section", "taxonomy", "term", "RSS", "robotsTXT"]

defaultContentLanguage = "es"

# The name of this wonderful theme ;-).
theme = "hugo-scroll"

# The browser tab name
title = "LauTea"

googleAnalytics = "G-GGDYGPBNGL"

# In order to add version information in the page's footer set to true.
enableGitInfo = true

# enable emoji processing in Markdown (valid only for pure markdown content)
enableEmoji = true

# Theme-specific variables `.Site.Params.myParamName`
[params]

    # The path to your "favicon". This should be a square (at least 32px x 32px) png-file.
    favicon = "images/logo.png"

    # These "images" are used by Hugo's internal opengraph and Twitter Card
    # templates, so this is what Slack, WhatsApp, X or LinkedIn show when
    # someone shares a link.
    # OJO con el formato: la convención de Open Graph es 1200x630 (1.91:1).
    # Acá estaba `images/logo.png`, que es un cuadrado de 1209x1209: cada red
    # lo recortaba a su antojo y la marca aparecía cortada. `og-default.png`
    # está generada en 1200x630 exactos, con la tipografía y la paleta reales.
    # See https://gohugo.io/templates/internal#open-graph.
    # NOT the actual header background image, go to _index.md instead
    images = ["images/og-default.png"]

    # When set true, it creates a visual guard (partially transparent rounded box), preventing non-ideal background images from interfering with title/description headings
    # Ideal images are homogenous around the centre and contrasting to the text.
    # see CSS classes: .title-and-description-guard, .blog-title, .blog-description
    # see _index.md header_headline and header_subheadline
    title_guard = false

    # Another "title" :-). This one is used as the site_name on the Hugo's internal
    # opengraph structured data template.
    # See https://ogp.me/ and https://gohugo.io/templates/internal#open-graph.
    title = "LauTea"

    # The "description" of your website. This is used in the meta data of your generated html.
    description = "Te invitamos a redescubrirte a vos y al camino del té en cada taza 🌱🍵"

    # Show a menu of languages available
    language_menu = true

    # Show also a language menu item for the current language, if false only
    # show the remaining languages
    show_current_lang = true

    # A "copyright"-line to be added at the bottom of the page.
    # Hint: Plain HTML is supported in here as well. So you may e.g. add a link to your legal imprint-page.
#    copyright = "© Jane Doe"

    # The sections of the home page alternate styling. Mark invert as true to swap the styling of the sections
    invertSectionColors = false

    # Options used for automatic image generation. see: https://gohugo.io/content-management/image-processing/
    image_options = "webp q90 lanczos photo"

    # Use "page_title | site_title" for <title> tags
    # e.g. <title>Legal | Jane Doe - Nutrition Coach & Chef Consultant</title>
    combine_page_and_site_title = false

    [params.footer]
    # Show contact icons for email/phone (if specified) in the footer of the page
    showContactIcons = false

    # Show links indicated with footer_menu and footer_menu_title in the footer of the page
    showFooterLinks = false

    [params.meta]
			keywords = "teablending,teenhebras,teargentino,loseleaftea,teablend,tea,teaceremony,ceremoniadete,blendsdete"

    [[params.contacts]]
        label = "url"
        value = "@lautea.blends"
        url = "https://www.instagram.com/lautea.blends/"
        icon = "fa fa-instagram"

     [[params.contacts]]
         label = "url"
         value = "@lautea.blends"
         url = "https://www.tiktok.com/@lautea.blends"
         icon = "fa fa-joplin"

     [[params.contacts]]
         label = "url"
         value = "@lautea.blends"
         url = "https://www.youtube.com/@lautea.blends"
         icon = "fa fa-youtube"

     [[params.contacts]]
         label = "url"
         value = "@lautea_blends"
         url = "https://ar.pinterest.com/lautea_blends/"
         icon = "fa fa-pinterest"


# Define additional languages
[languages]

  [languages.es]
    title = "LauTea"
    weight = 10
    contentDir = "content/es"
    languageName = "Español"

  [languages.en]
    weight = 20
    contentDir = "content/en"
    languageName = "English"

    # Sin esto, /en/ hereda la description en español de [params].
    # Los motores de IA pesan el idioma de la consulta: la versión en inglés
    # es una ventaja real sólo si está completa.
    [languages.en.params]
      title = "LauTea"
      description = "Argentine loose leaf tea and author blends. We invite you to rediscover yourself and the path of tea in every cup 🌱🍵"
      [languages.en.params.meta]
        keywords = "looseleaftea,teablend,teablending,argentinetea,tea,teaceremony,blends"
      [languages.en.params.footer]
        showContactIcons = false
        showFooterLinks = false

[services]
  [services.googleAnalytics]
    id = 'G-GGDYGPBNGL'
