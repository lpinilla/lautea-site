# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      # Tiene que coincidir con la version local: si el CI compila con otra
      # version, lo que vos verificas en tu maquina no es lo que se publica.
      HUGO_VERSION: 0.154.5
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Sin esto el clon es shallow y Hugo no puede leer la historia de
          # git, asi que `enableGitInfo` queda sin efecto y dateModified cae
          # al valor del front matter (una fecha que nadie actualiza).
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Notify IndexNow
        # Avisa a Bing/Yandex qué URLs cambiaron, para reindexarlas antes.
        # La clave no es un secreto: IndexNow la exige publicada en una URL
        # pública (/<clave>.txt). Acá se lee del archivo en static/, que es la
        # única fuente de verdad.
        # No es bloqueante: si IndexNow falla, el deploy sigue igual.
        continue-on-error: true
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          keyfile=$(ls static/*.txt 2>/dev/null | head -1 || true)
          if [ -z "$keyfile" ]; then
            echo "No hay archivo de clave IndexNow en static/; se omite."
            exit 0
          fi
          key=$(tr -d '[:space:]' < "$keyfile")
          host=$(printf '%s' "$BASE_URL" | sed -E 's#^https?://##; s#/.*$##')
          urls=$(grep -rhoP '(?<=<loc>)[^<]+(?=</loc>)' public/sitemap.xml public/*/sitemap.xml 2>/dev/null \
                 | sort -u \
                 | grep -v '/sitemap' \
                 | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          if [ -z "$urls" ] || [ "$urls" = "[]" ]; then
            echo "No se encontraron URLs en los sitemaps; se omite IndexNow."
            exit 0
          fi
          echo "Host: $host"
          echo "URLs a notificar: $urls"
          curl --silent --show-error --fail-with-body \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"${host}\",\"key\":\"${key}\",\"keyLocation\":\"${BASE_URL}/${key}.txt\",\"urlList\":${urls}}"
          echo "IndexNow notificado."
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
